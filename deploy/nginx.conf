# Serve only the generated dist directory, never the repository root.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    # Generated by npm run build; include again wherever add_header overrides inheritance.
    include /usr/share/nginx/html/nginx-security-headers.conf;
    location = /nginx-security-headers.conf { return 404; }
    location /assets/ {
        include /usr/share/nginx/html/nginx-security-headers.conf;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location / {
        include /usr/share/nginx/html/nginx-security-headers.conf;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
